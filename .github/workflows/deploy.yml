# Fetches fresh MLS sales + mortgage rates every morning and publishes the dashboard to GitHub Pages.
# Needs repository secrets MLS_API_BASE and MLS_ACCESS_TOKEN, and Pages source set to "GitHub Actions".
name: Refresh data and deploy

on:
  schedule:
    - cron: '0 14 * * *' # 14:00 UTC = 6-7am Pacific
  workflow_dispatch: # "Run workflow" button
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      TZ: America/Los_Angeles # date windows use the Bay Area calendar date
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Reuse cached months so a daily run only re-downloads recent data (~11 requests, not ~700).
      - name: Restore MLS month cache
        uses: actions/cache@v4
        with:
          path: data/raw
          key: mls-raw-${{ github.run_id }}
          restore-keys: mls-raw-

      - name: Fetch sales and mortgage rates
        env:
          MLS_API_BASE: ${{ secrets.MLS_API_BASE }}
          MLS_ACCESS_TOKEN: ${{ secrets.MLS_ACCESS_TOKEN }}
        run: npm run fetch

      # Site layout mirrors the repo so dashboard/index.html finds ../data/*.js.
      - name: Assemble site
        run: |
          mkdir -p _site/data
          cp -r dashboard _site/dashboard
          cp data/sales.js data/rates.js _site/data/
          printf '<!doctype html><meta charset="utf-8"><meta http-equiv="refresh" content="0; url=dashboard/"><a href="dashboard/">Bay Area Market Monitor</a>\n' > _site/index.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
